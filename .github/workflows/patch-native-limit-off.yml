name: Patch native Google Forms limit off

on:
  push:
    paths:
      - '.github/workflows/patch-native-limit-off.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Apps Script backend
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps-script/controle-participation-google.gs')
          t = p.read_text(encoding='utf-8')
          old = t

          t = t.replace(
              '  formulaire.setLimitOneResponsePerUser(true);',
              '  formulaire.setLimitOneResponsePerUser(false);',
              1,
          )

          t = t.replace(
              "    if (!questionReference || !formulaire.hasLimitOneResponsePerUser()) {\n      return resultatRefus_('configuration_error');\n    }",
              "    if (!questionReference) {\n      return resultatRefus_('configuration_error');\n    }",
              1,
          )

          t = t.replace(
              " * puis active la limite native d'une réponse par compte Google.",
              " * puis désactive la limite native Google Forms. La règle une réponse par compte\n * est appliquée par le contrôle backend, avec exception explicite pour le compte de test.",
              1,
          )

          required = [
              "TEST_EXEMPT_EMAIL: 'nachchatmahmoud@gmail.com'",
              'formulaire.setLimitOneResponsePerUser(false);',
              "if (!questionReference) {",
              'allowed: compteTestExempte || !participation',
              'if (!compteTestExempte && participationVerrouillee)',
          ]
          missing = [x for x in required if x not in t]
          if missing:
              raise SystemExit('Patch incomplet: ' + ', '.join(missing))

          if t != old:
              p.write_text(t, encoding='utf-8')
              print('Backend corrigé: limite native OFF, contrôle backend conservé.')
          else:
              print('Backend déjà corrigé.')

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- apps-script/controle-participation-google.gs; then
            echo "No change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/controle-participation-google.gs
          git commit -m "Use backend one-response enforcement with owner exception"
          git push
