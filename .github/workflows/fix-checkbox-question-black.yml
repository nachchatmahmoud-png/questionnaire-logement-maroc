name: Fix checkbox question legend color

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-checkbox-question-black.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-fix-checkbox-question-black
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply black checkbox question legend
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify
        run: grep -q 'checkbox-question-legend-black-20260812' index.html
      - name: Commit patch
        run: |
          rm .github/workflows/fix-checkbox-question-black.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-checkbox-question-black.yml
          git commit -m 'Keep checkbox questions black'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
