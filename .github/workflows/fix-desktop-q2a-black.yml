name: Fix q2a black on desktop

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-desktop-q2a-black.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-q2a-desktop-black
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop override
        run: echo '' | base64 -d | python
      - name: Verify
        run: |
          grep -q 'desktop-q2a-black-20260812-v1' index.html
          grep -q 'legend.checkbox-question-title' index.html
          grep -q 'desktop-question-black-v41' index.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-desktop-q2a-black.yml
          git add index.html .github/workflows/fix-desktop-q2a-black.yml
          git commit -m 'Force q2a title black on desktop'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
