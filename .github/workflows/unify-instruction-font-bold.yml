name: Unify questionnaire instruction font and weight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-instruction-font-bold.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-instruction-font-bold
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unify instruction typography
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); marker='instruction-typography-unified-20260812'; css='\n      /* '+marker+' */\n      html body .question-help,\n      html body .instruction-card > strong,\n      html body .instruction-card > p,\n      html body .interaction-channels-card > p,\n      html body .interaction-channels-card .interaction-lead,\n      html body .interaction-channels-card bdi,\n      html body fieldset.question-card:has(input[type=\\\"checkbox\\\"]) > legend{\n        color:#6b7280 !important;\n        font-family:\\\"Noto Sans Arabic\\\",Tahoma,Arial,sans-serif !important;\n        font-weight:700 !important;\n      }\n'; p.write_text(s if marker in s else s.replace('</style>',css+'</style>'),encoding='utf-8')"

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/unify-instruction-font-bold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/unify-instruction-font-bold.yml
          git commit -m 'Use same bold font for questionnaire instructions'
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
