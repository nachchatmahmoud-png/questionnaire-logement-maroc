name: Synchroniser Q2 et Q2-b

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-q2-q2b-20260813.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aligner les formulations et la migration Apps Script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          q2_new = 'س2. هل سبق أن اطلعتم على معلومات حول برنامج الدعم المباشر للسكن من خلال إحدى القنوات الرسمية للوزارة؟'
          q2b_new = 'س2-ب. ما السبب الرئيسي لعدم اطلاعكم على معلومات حول البرنامج عبر القنوات الرسمية للوزارة؟'

          q2_old_variants = [
              'س2. هل سبق لكم الاطلاع على معلومات حول برنامج الدعم المباشر للسكن عبر إحدى وسائل التواصل الرسمية للوزارة؟',
              'س2. هل سبق لكم الاطلاع على معلومات حول برنامج الدعم المباشر للسكن من خلال إحدى وسائل التواصل الرسمية للوزارة؟',
              'س2. هل سبق أن اطلعتم على معلومات حول برنامج الدعم المباشر للسكن عبر إحدى وسائل التواصل الرسمية للوزارة؟',
          ]
          q2b_old_variants = [
              'س2-ب. ما السبب الرئيسي لعدم اطلاعكم على معلومات حول البرنامج عبر القنوات الرسمية للوزارة أو للبرنامج؟',
              'س2-ب. ما السبب الرئيسي لعدم اطلاعكم على معلومات حول البرنامج عبر وسائل التواصل الرسمية للوزارة؟',
          ]

          targets = [
              Path('assets/questionnaire.js'),
              Path('scripts/verify-ui-lock.mjs'),
              Path('apps-script/controle-participation-google.gs'),
          ]
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for old in q2_old_variants:
                  text = text.replace(old, q2_new)
              for old in q2b_old_variants:
                  text = text.replace(old, q2b_new)
              text = text.replace("سبب آخر، يرجى التحديد: __________", "سبب آخر، يرجى التحديد:")
              path.write_text(text, encoding='utf-8')

          app = Path('apps-script/controle-participation-google.gs')
          text = app.read_text(encoding='utf-8')
          text = text.replace("QUESTIONNAIRE_UPDATE_20260812_V2", "QUESTIONNAIRE_UPDATE_20260813_V3")

          title_anchor = "  NO_OFFICIAL_REASON_TITLE: '" + q2b_new + "',"
          if '  Q2_TITLE:' not in text:
              text = text.replace(
                  title_anchor,
                  "  Q2_TITLE: '" + q2_new + "',\n"
                  "  Q2_LEGACY_PREFIX: 'س2. هل سبق',\n"
                  + title_anchor
              )

          text = re.sub(
              r"  NO_OFFICIAL_REASON_LEGACY_TITLES: \[[^\n]*\],",
              "  NO_OFFICIAL_REASON_LEGACY_PREFIX: 'ما السبب الرئيسي لعدم اطلاعكم على معلومات حول البرنامج عبر ',",
              text,
              count=1,
          )

          q2_insert_anchor = "    questions.no_official_reason = trouverQuestionUniqueParTitre_(\n"
          if 'questions.q2 = trouverQuestionUniqueParTitre_' not in text:
              q2_block = """    questions.q2 = trouverQuestionUniqueParTitre_(
              formulaire,
              FormApp.ItemType.MULTIPLE_CHOICE,
              MISE_A_JOUR_QUESTIONNAIRE.Q2_TITLE
            );
            if (!questions.q2) {
              const anciennesQ2 = formulaire.getItems(FormApp.ItemType.MULTIPLE_CHOICE).filter(function (item) {
                const titre = item.getTitle().trim();
                return titre.indexOf(MISE_A_JOUR_QUESTIONNAIRE.Q2_LEGACY_PREFIX) === 0 &&
                  titre.indexOf('برنامج الدعم المباشر للسكن') !== -1;
              });
              if (anciennesQ2.length > 1) throw new Error('CONFIGURATION_MISSING');
              if (anciennesQ2.length === 1) {
                questions.q2 = anciennesQ2[0].asMultipleChoiceItem();
                questions.q2.setTitle(MISE_A_JOUR_QUESTIONNAIRE.Q2_TITLE);
                changementStructurel = true;
              }
            }

          """
              text = text.replace(q2_insert_anchor, q2_block + q2_insert_anchor, 1)

          text = text.replace(
              "return MISE_A_JOUR_QUESTIONNAIRE.NO_OFFICIAL_REASON_LEGACY_TITLES.indexOf(item.getTitle()) !== -1;",
              "const titre = item.getTitle().trim();\n"
              "        const titreSansNumero = titre.replace(/^س2-ب\\.\\s*/, '');\n"
              "        return titreSansNumero.indexOf(MISE_A_JOUR_QUESTIONNAIRE.NO_OFFICIAL_REASON_LEGACY_PREFIX) === 0;"
          )

          config_anchor = "      !questions.preferred_public_channel ||\n      !questions.no_official_reason ||"
          if "      !questions.q2 ||" not in text:
              text = text.replace(
                  config_anchor,
                  "      !questions.preferred_public_channel ||\n      !questions.q2 ||\n      !questions.no_official_reason ||",
                  1,
              )

          app.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(
              r"questionnaire\.js\?v=[^\"']+",
              "questionnaire.js?v=20260813-q2-q2b-v43",
              html,
              count=1,
          )
          index.write_text(html, encoding='utf-8')

          # Contrôle ciblé des fichiers applicatifs, sans inclure ce workflow
          # qui contient volontairement les anciennes chaînes comme règles de migration.
          scan_roots = [Path('assets'), Path('apps-script'), Path('scripts'), Path('index.html')]
          violations = []
          files = []
          for root in scan_roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(p for p in root.rglob('*') if p.is_file())
          for path in files:
              if path.suffix.lower() not in {'.js', '.mjs', '.gs', '.html', '.md'}:
                  continue
              data = path.read_text(encoding='utf-8', errors='ignore')
              for line_no, line in enumerate(data.splitlines(), 1):
                  if ('س2.' in line and 'وسائل التواصل الرسمية' in line) or \
                     ('س2-ب.' in line and 'وسائل التواصل الرسمية' in line) or \
                     ('س2-ب.' in line and 'للوزارة أو للبرنامج' in line) or \
                     ('ما السبب الرئيسي لعدم اطلاعكم على معلومات حول البرنامج' in line and 'وسائل التواصل الرسمية' in line):
                      violations.append(f'{path}:{line_no}:{line.strip()}')
          if violations:
              raise SystemExit('Anciennes formulations détectées:\n' + '\n'.join(violations))

          site = Path('assets/questionnaire.js').read_text(encoding='utf-8')
          app_text = app.read_text(encoding='utf-8')
          assert q2_new in site
          assert q2b_new in site
          assert "const NO_OFFICIAL_REASON_OTHER='سبب آخر، يرجى التحديد:';" in site
          assert "route=()=>val('q1')==='لا'?'g1':val('q2')==='لا'?'g2':'official';" in site
          assert "radio('no_official_reason'," in site
          assert "'يرجى اختيار جواب واحد فقط.'" in site
          assert q2_new in app_text
          assert q2b_new in app_text
          assert "questions.q2.setTitle(MISE_A_JOUR_QUESTIONNAIRE.Q2_TITLE);" in app_text
          assert ".setRequired(true);" in app_text
          PY

      - name: Vérifications syntaxiques
        shell: bash
        run: |
          node --check assets/questionnaire.js
          node scripts/verify-ui-lock.mjs
          cp apps-script/controle-participation-google.gs /tmp/controle-participation-google.js
          node --check /tmp/controle-participation-google.js
          git diff --check

      - name: Commit des changements
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Aucun changement à enregistrer.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/questionnaire.js apps-script/controle-participation-google.gs scripts/verify-ui-lock.mjs index.html
          git commit -m 'Align Q2 and Q2-b wording'
          git push origin main
