name: Synchroniser Q2 et Q2-b

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-q2-q2b-20260813.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aligner Q2 et Q2-b
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          Q2 = 'س2. هل سبق أن اطلعتم على معلومات حول برنامج الدعم المباشر للسكن من خلال إحدى القنوات الرسمية للوزارة؟'
          Q2B = 'س2-ب. ما السبب الرئيسي لعدم اطلاعكم على معلومات حول البرنامج عبر القنوات الرسمية للوزارة؟'
          OTHER = 'سبب آخر، يرجى التحديد:'

          q2_old = [
              'س2. هل سبق لكم الاطلاع على معلومات حول برنامج الدعم المباشر للسكن عبر إحدى وسائل التواصل الرسمية للوزارة؟',
              'س2. هل سبق لكم الاطلاع على معلومات حول برنامج الدعم المباشر للسكن من خلال إحدى وسائل التواصل الرسمية للوزارة؟',
              'س2. هل سبق أن اطلعتم على معلومات حول برنامج الدعم المباشر للسكن عبر إحدى وسائل التواصل الرسمية للوزارة؟',
          ]
          q2b_old = [
              'س2-ب. ما السبب الرئيسي لعدم اطلاعكم على معلومات حول البرنامج عبر القنوات الرسمية للوزارة أو للبرنامج؟',
              'س2-ب. ما السبب الرئيسي لعدم اطلاعكم على معلومات حول البرنامج عبر وسائل التواصل الرسمية للوزارة؟',
          ]
          q2b_legacy_old = 'ما السبب الرئيسي لعدم اطلاعكم على معلومات حول البرنامج عبر وسائل التواصل الرسمية للوزارة؟'

          # Site + vérificateur : formulation exacte uniquement.
          for filename in ['assets/questionnaire.js', 'scripts/verify-ui-lock.mjs']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old in q2_old:
                  text = text.replace(old, Q2)
              for old in q2b_old:
                  text = text.replace(old, Q2B)
              text = text.replace('سبب آخر، يرجى التحديد: __________', OTHER)
              p.write_text(text, encoding='utf-8')

          # Apps Script : mêmes formulations + migration idempotente de Q2 et Q2-b.
          app = Path('apps-script/controle-participation-google.gs')
          text = app.read_text(encoding='utf-8')
          for old in q2_old:
              text = text.replace(old, Q2)
          for old in q2b_old:
              text = text.replace(old, Q2B)
          text = text.replace('QUESTIONNAIRE_UPDATE_20260812_V2', 'QUESTIONNAIRE_UPDATE_20260813_V3')

          no_title = "  NO_OFFICIAL_REASON_TITLE: '" + Q2B + "',"
          if '  Q2_TITLE:' not in text:
              text = text.replace(
                  no_title,
                  "  Q2_TITLE: '" + Q2 + "',\n"
                  "  Q2_LEGACY_PREFIX: 'س2. هل سبق',\n"
                  + no_title,
                  1
              )

          # Ne conserve pas l'ancienne phrase complète dans le code.
          text = text.replace(
              "  NO_OFFICIAL_REASON_LEGACY_TITLES: ['" + q2b_legacy_old + "'],",
              "  NO_OFFICIAL_REASON_LEGACY_PREFIX: 'ما السبب الرئيسي لعدم اطلاعكم على معلومات حول البرنامج عبر ',"
          )

          q2_anchor = "    questions.no_official_reason = trouverQuestionUniqueParTitre_(\n"
          if 'questions.q2 = trouverQuestionUniqueParTitre_' not in text:
              q2_block = """    questions.q2 = trouverQuestionUniqueParTitre_(
              formulaire,
              FormApp.ItemType.MULTIPLE_CHOICE,
              MISE_A_JOUR_QUESTIONNAIRE.Q2_TITLE
            );
            if (!questions.q2) {
              const anciennesQ2 = formulaire.getItems(FormApp.ItemType.MULTIPLE_CHOICE).filter(function (item) {
                const titre = item.getTitle().trim();
                return titre.indexOf(MISE_A_JOUR_QUESTIONNAIRE.Q2_LEGACY_PREFIX) === 0 &&
                  titre.indexOf('برنامج الدعم المباشر للسكن') !== -1;
              });
              if (anciennesQ2.length > 1) throw new Error('CONFIGURATION_MISSING');
              if (anciennesQ2.length === 1) {
                questions.q2 = anciennesQ2[0].asMultipleChoiceItem();
                questions.q2.setTitle(MISE_A_JOUR_QUESTIONNAIRE.Q2_TITLE);
                changementStructurel = true;
              }
            }

          """
              text = text.replace(q2_anchor, q2_block + q2_anchor, 1)

          text = text.replace(
              "return MISE_A_JOUR_QUESTIONNAIRE.NO_OFFICIAL_REASON_LEGACY_TITLES.indexOf(item.getTitle()) !== -1;",
              "const titre = item.getTitle().trim();\n"
              "        const titreSansNumero = titre.replace(/^س2-ب\\.\\s*/, '');\n"
              "        return titreSansNumero.indexOf(MISE_A_JOUR_QUESTIONNAIRE.NO_OFFICIAL_REASON_LEGACY_PREFIX) === 0;"
          )

          if "      !questions.q2 ||" not in text:
              text = text.replace(
                  "      !questions.preferred_public_channel ||\n      !questions.no_official_reason ||",
                  "      !questions.preferred_public_channel ||\n      !questions.q2 ||\n      !questions.no_official_reason ||",
                  1
              )
          app.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'questionnaire\.js\?v=[^\"\']+', 'questionnaire.js?v=20260813-q2-q2b-v43', html, count=1)
          index.write_text(html, encoding='utf-8')

          # Contrôle exact des fichiers applicatifs : aucune ancienne formulation de Q2/Q2-b.
          candidates = [Path('assets/questionnaire.js'), Path('scripts/verify-ui-lock.mjs'), app, index]
          forbidden = q2_old + q2b_old + [q2b_legacy_old]
          violations = []
          for p in candidates:
              data = p.read_text(encoding='utf-8')
              for old in forbidden:
                  if old in data:
                      violations.append(f'{p}: {old}')
          if violations:
              raise SystemExit('Anciennes formulations encore présentes:\n' + '\n'.join(violations))

          site = Path('assets/questionnaire.js').read_text(encoding='utf-8')
          backend = app.read_text(encoding='utf-8')
          assert Q2 in site and Q2B in site
          assert "const NO_OFFICIAL_REASON_OTHER='" + OTHER + "';" in site
          assert "route=()=>val('q1')==='لا'?'g1':val('q2')==='لا'?'g2':'official';" in site
          assert "radio('no_official_reason'," in site
          assert "'يرجى اختيار جواب واحد فقط.'" in site
          assert Q2 in backend and Q2B in backend
          assert 'Q2_LEGACY_PREFIX' in backend
          assert 'NO_OFFICIAL_REASON_LEGACY_PREFIX' in backend
          assert 'questions.q2.setTitle(MISE_A_JOUR_QUESTIONNAIRE.Q2_TITLE);' in backend
          assert '.setHelpText(MISE_A_JOUR_QUESTIONNAIRE.NO_OFFICIAL_REASON_HELP)' in backend
          assert '.setRequired(true);' in backend
          PY

      - name: Vérifications syntaxiques
        shell: bash
        run: |
          node --check assets/questionnaire.js
          node scripts/verify-ui-lock.mjs
          cp apps-script/controle-participation-google.gs /tmp/controle-participation-google.js
          node --check /tmp/controle-participation-google.js
          git diff --check

      - name: Publier les changements
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Aucun changement à enregistrer.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/questionnaire.js apps-script/controle-participation-google.gs scripts/verify-ui-lock.mjs index.html
          git commit -m 'Align Q2 and Q2-b wording'
          git push origin main
