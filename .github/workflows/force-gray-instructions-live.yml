name: Force gray questionnaire instructions live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-gray-instructions-live.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-gray-instructions-live
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force desktop instruction gray styling in index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('index-iQBeb6Ok.css?v=20260807-access-21','index-iQBeb6Ok.css?v=20260812-instructions-gray-v2')
          marker = 'desktop-instruction-gray-inline-20260812-v2'
          block = '\n      /* desktop-instruction-gray-inline-20260812-v2 */\n      @media (min-width:761px){\n        html body .question-help,\n        html body .instruction-card > p,\n        html body .instruction-card:has(.legend-grid) > strong,\n        html body .interaction-channels-card > p,\n        html body .interaction-channels-card .interaction-lead,\n        html body .interaction-channels-card bdi,\n        html body fieldset.question-card:has(input[type="checkbox"]) > legend{\n          color:#6b7280 !important;\n        }\n      }\n'
          if marker not in text:
              pos = text.find('</style>')
              if pos == -1:
                  raise SystemExit('Balise </style> introuvable')
              text = text[:pos] + block + text[pos:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/force-gray-instructions-live.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/force-gray-instructions-live.yml
          git commit -m 'Force gray instruction styling in live page'
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
