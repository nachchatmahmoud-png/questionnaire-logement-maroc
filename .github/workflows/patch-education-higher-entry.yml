name: Patch education higher entry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-education-higher-entry.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Patch questionnaire site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/questionnaire.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              "q1:'299895912',q2:'1225420672',age:'1577939573',gender:'2068308268',education:'1330802393',housing:'1373868444',residence:'865830704',professional:'1061681182',region:'861634292',country:'1099313147'",
              "q1:'299895912',q2:'1225420672',age:'1577939573',gender:'2068308268',education:'1330802393',education_higher_detail:'54285798',housing:'1373868444',residence:'865830704',professional:'1061681182',region:'861634292',country:'1099313147'"
            ),
            (
              "if(val('education')==='التعليم العالي'&&val('education_higher_detail'))supplemental.education_higher_detail=val('education_higher_detail');\n",
              ""
            ),
            (
              "['age','gender','education','housing','residence','region','country','professional'].forEach(k=>addCommon(k,val(k)));",
              "['age','gender','education','education_higher_detail','housing','residence','region','country','professional'].forEach(k=>addCommon(k,val(k)));"
            ),
            (
              "const SCHEMA_VERSION='2026-08-15-interaction-fusion-v2';",
              "const SCHEMA_VERSION='2026-08-16-education-higher-entry-v1';"
            ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected pattern not found: {old[:120]}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          import re
          h2, n = re.subn(r'assets/questionnaire\.js\?v=[^"\']+', 'assets/questionnaire.js?v=20260816-education-higher-entry-v1', h, count=1)
          if n == 0:
              raise SystemExit('questionnaire.js cache-buster not found in index.html')
          idx.write_text(h2, encoding='utf-8')
          PY

      - name: Commit final patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-education-higher-entry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/questionnaire.js index.html .github/workflows/patch-education-higher-entry.yml
          git commit -m "Sync higher education detail with Google Form"
          git push origin HEAD:main

      - name: Dispatch Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches \
            -d '{"ref":"main"}'
