name: Temporary Pages dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-pages-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/dispatch-pages-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dispatch-pages-once.yml
          git commit -m "Remove temporary Pages dispatcher"
          git push origin HEAD:main

      - name: Dispatch Pages workflow on latest main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches \
            -d '{"ref":"main"}'
