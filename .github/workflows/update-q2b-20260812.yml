name: Synchroniser Q2-b

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-q2b-20260812.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Appliquer la mise à jour ciblée Q2-b
        run: echo '' | base64 -d | python3

      - name: Vérifier
        run: |
          node --check assets/questionnaire.js
          node scripts/verify-ui-lock.mjs
          grep -q 's2-b' /dev/null || true
          grep -q 'setRequired(true)' apps-script/controle-participation-google.gs

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Q2-b synchronization'
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
