name: Number conditional source questions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/number-conditional-questions.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-number-conditional-questions
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply numbering
        shell: bash
        run: echo '' | base64 -d | python
      - name: Verify numbering
        shell: bash
        run: |
          grep -q 'س1-أ. عبر أي وسيلة' assets/questionnaire.js
          grep -q 'س2-أ. من خلال أي من المصادر' assets/questionnaire.js
          grep -q 'س2-ب. ما السبب الرئيسي' assets/questionnaire.js
          grep -q 'numbered-conditionals-v39' index.html
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/number-conditional-questions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/questionnaire.js index.html .github/workflows/number-conditional-questions.yml
          git commit -m 'Number conditional questionnaire questions'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
