name: Apply desktop instruction gray style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-desktop-instruction-gray.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add desktop-only gray styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/index-iQBeb6Ok.css')
          css = css_path.read_text(encoding='utf-8')
          marker = 'desktop-instruction-gray-20260812'
          block = r'''

/* desktop-instruction-gray-20260812 — consignes en gris sur ordinateur uniquement */
@media (min-width: 761px) {
  .question-help,
  .instruction-card > strong,
  .instruction-card > p,
  .interaction-channels-card > p,
  .interaction-channels-card .interaction-lead,
  .interaction-channels-card bdi,
  fieldset.question-card:has(input[type="checkbox"]) > legend {
    color: #6b7280 !important;
  }
}
'''
          if marker not in css:
              css_path.write_text(css.rstrip() + block + '\n', encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-desktop-instruction-gray.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/index-iQBeb6Ok.css .github/workflows/apply-desktop-instruction-gray.yml
          git commit -m 'Style questionnaire instructions gray on desktop'
          git push
