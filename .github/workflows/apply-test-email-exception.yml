name: Apply test email exception

on:
  push:
    paths:
      - '.github/workflows/apply-test-email-exception.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Apps Script participation control
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps-script/controle-participation-google.gs')
          text = path.read_text(encoding='utf-8')
          original = text
          text = text.replace("  CLIENT_ID: '285878510024-7dhdojiucp6ff20m2snuro018t70c6s5.apps.googleusercontent.com',\n", "  CLIENT_ID: '285878510024-7dhdojiucp6ff20m2snuro018t70c6s5.apps.googleusercontent.com',\n  TEST_EXEMPT_EMAIL: 'nachchatmahmoud@gmail.com',\n", 1)
          text = text.replace("    const formulaire = obtenirFormulaire_();\n", "    const compteTestExempte = estCompteTestExempte_(identite);\n\n    const formulaire = obtenirFormulaire_();\n", 1)
          old_check = "    if (action === 'check') {\n      return {\n        ok: true,\n        allowed: !participation,\n        exempt: false,\n        reason: participation ? 'already_submitted' : 'eligible',\n        submissionEntryId: submissionEntryId,\n      };\n    }\n"
          new_check = "    if (action === 'check') {\n      return {\n        ok: true,\n        allowed: compteTestExempte || !participation,\n        exempt: compteTestExempte,\n        reason: compteTestExempte ? 'test_account_exempt' : participation ? 'already_submitted' : 'eligible',\n        submissionEntryId: submissionEntryId,\n      };\n    }\n"
          text = text.replace(old_check, new_check, 1)
          text = text.replace("      if (participationVerrouillee) {\n", "      if (!compteTestExempte && participationVerrouillee) {\n", 1)
          old_write = "      feuille.appendRow([empreinte, new Date(), submissionId, String(reponse.getId() || '')]);\n      SpreadsheetApp.flush();\n      return {\n        ok: true,\n        allowed: true,\n        exempt: false,\n        reason: action === 'submit' ? 'submitted' : 'confirmed',\n      };\n"
          new_write = "      if (!compteTestExempte) {\n        feuille.appendRow([empreinte, new Date(), submissionId, String(reponse.getId() || '')]);\n        SpreadsheetApp.flush();\n      }\n      return {\n        ok: true,\n        allowed: true,\n        exempt: compteTestExempte,\n        reason: compteTestExempte ? 'test_account_exempt' : action === 'submit' ? 'submitted' : 'confirmed',\n      };\n"
          text = text.replace(old_write, new_write, 1)
          old_identity = "  return { sub: String(donnees.sub) };\n}\n\nfunction creerEmpreinteCompte_(sub) {\n"
          new_identity = "  return {\n    sub: String(donnees.sub),\n    email: String(donnees.email || '').trim().toLowerCase(),\n  };\n}\n\nfunction estCompteTestExempte_(identite) {\n  return Boolean(\n    identite &&\n    identite.email &&\n    identite.email === String(CONTROLE_PARTICIPATION.TEST_EXEMPT_EMAIL || '').trim().toLowerCase()\n  );\n}\n\nfunction creerEmpreinteCompte_(sub) {\n"
          text = text.replace(old_identity, new_identity, 1)
          required = ["TEST_EXEMPT_EMAIL: 'nachchatmahmoud@gmail.com'", "const compteTestExempte = estCompteTestExempte_(identite);", "allowed: compteTestExempte || !participation", "if (!compteTestExempte && participationVerrouillee)", "function estCompteTestExempte_(identite)"]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Patch incomplet: ' + ', '.join(missing))
          if text != original:
              path.write_text(text, encoding='utf-8')
              print('Exception appliquée à nachchatmahmoud@gmail.com.')
          else:
              print('Exception déjà appliquée.')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- apps-script/controle-participation-google.gs; then
            echo "No change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/controle-participation-google.gs
          git commit -m "Allow owner test account repeated submissions"
          git push
