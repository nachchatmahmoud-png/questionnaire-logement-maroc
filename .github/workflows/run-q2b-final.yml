name: Finaliser Q2-b

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-q2b-final.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Appliquer le patch Q2-b validé
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, subprocess
          workflow = Path('.github/workflows/update-q2b-20260812.yml').read_text(encoding='utf-8')
          match = re.search(r"run: echo '([^']+)' \| base64 -d \| python3", workflow)
          if not match:
              raise SystemExit('PATCH_Q2B_INTROUVABLE')
          code = base64.b64decode(match.group(1))
          subprocess.run(['python3'], input=code, check=True)
          Path('.github/workflows/run-q2b-final.yml').unlink(missing_ok=True)
          PY

      - name: Vérifier le site et le backend versionné
        run: |
          node --check assets/questionnaire.js
          node scripts/verify-ui-lock.mjs
          grep -q 'setRequired(true)' apps-script/controle-participation-google.gs
          grep -q 'NO_OFFICIAL_REASON_LEGACY_TITLES' apps-script/controle-participation-google.gs
          grep -q '20260812-q2b-v42' index.html

      - name: Enregistrer les modifications ciblées
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Q2-b synchronization'
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
