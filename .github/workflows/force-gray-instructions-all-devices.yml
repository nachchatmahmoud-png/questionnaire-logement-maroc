name: Apply gray instructions on all devices

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-gray-instructions-all-devices.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-gray-instructions-all-devices
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply gray instruction styling everywhere
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'instruction-gray-all-devices-20260812'
          block = '\n      /* instruction-gray-all-devices-20260812 */\n      html body .question-help,\n      html body .instruction-card > strong,\n      html body .instruction-card > p,\n      html body .interaction-channels-card > p,\n      html body .interaction-channels-card .interaction-lead,\n      html body .interaction-channels-card bdi,\n      html body fieldset.question-card:has(input[type="checkbox"]) > legend{\n        color:#6b7280 !important;\n      }\n'
          if marker not in text:
              pos = text.find('</style>')
              if pos == -1:
                  raise SystemExit('Balise </style> introuvable')
              text = text[:pos] + block + text[pos:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/force-gray-instructions-all-devices.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/force-gray-instructions-all-devices.yml
          git commit -m 'Keep questionnaire instructions gray on all devices'
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
