name: Install questionnaire UI lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-ui-lock.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-install-ui-lock
  cancel-in-progress: true

jobs:
  install-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Load locked stylesheet last
        run: echo '' | base64 -d | python
      - name: Verify UI lock
        run: node scripts/verify-ui-lock.mjs
      - name: Commit lock installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/install-ui-lock.yml
          git add index.html .github/workflows/install-ui-lock.yml
          git commit -m 'Load protected UI styles last'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
