name: Fix question instruction structure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-question-instruction-structure.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply structural spacing fix
        run: echo '' | base64 -d | python

      - name: Verify
        run: |
          grep -q 'function checks(items,question' assets/questionnaire.js
          grep -q 'question-instruction-spacing-20260812-v3' index.html

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/questionnaire.js index.html
          git commit -m 'Fix actual question instruction spacing structure'
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
