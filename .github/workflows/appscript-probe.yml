name: Apps Script probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appscript-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Apps Script endpoint
        shell: bash
        run: |
          set +e
          ENDPOINT='https://script.google.com/macros/s/AKfycbzWv9vYyyvLkP0htcW7ch4w6rn-CcFNK8BA2L04eVbmAVtE05w0i1yiJwnMgZSOpyNZ/exec'
          {
            echo "timestamp=$(date -u +%FT%TZ)"
            echo '--- GET ---'
            curl -L -sS -D /tmp/get_headers.txt -o /tmp/get_body.txt -w 'http=%{http_code}\nfinal=%{url_effective}\n' "$ENDPOINT"
            echo 'headers:'
            sed -n '1,40p' /tmp/get_headers.txt
            echo 'body:'
            head -c 4000 /tmp/get_body.txt
            echo
            echo '--- POST INVALID (no form response should be created) ---'
            curl -L -sS -D /tmp/post_headers.txt -o /tmp/post_body.txt -w 'http=%{http_code}\nfinal=%{url_effective}\n' -X POST --data-urlencode 'payload={"answers":null}' "$ENDPOINT"
            echo 'headers:'
            sed -n '1,40p' /tmp/post_headers.txt
            echo 'body:'
            head -c 4000 /tmp/post_body.txt
            echo
          } > appscript-probe-result.txt 2>&1
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appscript-probe-result.txt
          git commit -m 'Add Apps Script probe result' || exit 0
          git push
