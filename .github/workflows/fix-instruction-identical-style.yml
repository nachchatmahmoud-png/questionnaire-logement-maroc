name: Fix instruction typography

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-instruction-identical-style.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make instruction size identical
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); m='/* instruction-typography-unified-20260812 */'; a,b=s.split(m,1); b=b.replace('font-weight:700 !important;','font-weight:700 !important;\\n        font-size:1rem !important;\\n        line-height:1.7 !important;',1); p.write_text(a+m+b,encoding='utf-8')"

      - name: Commit patch
        run: |
          rm .github/workflows/fix-instruction-identical-style.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/fix-instruction-identical-style.yml
          git commit -m "Make instruction typography identical on all screens"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4
