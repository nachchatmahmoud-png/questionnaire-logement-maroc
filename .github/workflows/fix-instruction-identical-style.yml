name: Make instruction typography identical everywhere

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-instruction-identical-style.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-instruction-identical-style
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make all instruction typography identical
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'instruction-typography-identical-20260812-v2'
          block = '''
      /* instruction-typography-identical-20260812-v2 */
      html body .question-help,
      html body .instruction-card > strong,
      html body .instruction-card > p,
      html body .interaction-channels-card > p,
      html body .interaction-channels-card .interaction-lead,
      html body .interaction-channels-card bdi,
      html body fieldset.question-card:has(input[type="checkbox"]) > legend{
        color:#6b7280 !important;
        font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif !important;
        font-size:1rem !important;
        font-weight:700 !important;
        font-style:normal !important;
        line-height:1.7 !important;
      }
'''
          if marker not in text:
              text = text.replace('</style>', block + '</style>', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/fix-instruction-identical-style.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-instruction-identical-style.yml
          git commit -m 'Make all questionnaire instructions visually identical'
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
