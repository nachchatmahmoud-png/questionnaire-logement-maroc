name: Fix auth googleusercontent origin

on:
  push:
    paths:
      - '.github/workflows/fix-auth-googleusercontent-origin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth bridge listener and timeout
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('assets/questionnaire.js')
          text = js.read_text(encoding='utf-8')

          old_origin = "const origineGoogleValide=event.origin==='https://script.google.com'||/^https:\\/\\/[-a-z0-9]+-script\\.googleusercontent\\.com$/.test(event.origin);"
          new_origin = "const origineGoogleValide=event.origin==='https://script.google.com'||event.origin==='https://script.googleusercontent.com'||/^https:\\/\\/[-a-z0-9]+-script\\.googleusercontent\\.com$/.test(event.origin)||/^https:\\/\\/[-a-z0-9]+\\.script\\.googleusercontent\\.com$/.test(event.origin);"
          if old_origin not in text:
              raise SystemExit('Expected origin validation line not found')
          text = text.replace(old_origin, new_origin, 1)

          old_timeout = "const timeoutMs=action==='check'?15000:120000;"
          new_timeout = "const timeoutMs=action==='check'?60000:120000;"
          if old_timeout not in text:
              raise SystemExit('Expected auth timeout line not found')
          text = text.replace(old_timeout, new_timeout, 1)
          js.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('questionnaire.js?v=20260814-auth-v6', 'questionnaire.js?v=20260814-auth-v9')
          index.write_text(html, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/questionnaire.js index.html
          git commit -m 'Fix Apps Script auth response origin handling'
          git push
