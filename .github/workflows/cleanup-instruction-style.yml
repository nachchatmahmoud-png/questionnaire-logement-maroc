name: Clean obsolete instruction styling rules

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-instruction-style.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  cleanup-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove obsolete instruction CSS
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); a=s.find('      /* desktop-instruction-gray-inline-20260812-v2 */'); b=s.find('      /* instruction-final-semantic-style-20260812 */'); s=s[:a]+s[b:] if a!=-1 and b!=-1 and a<b else s; p.write_text(s,encoding='utf-8')"

      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/cleanup-instruction-style.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/cleanup-instruction-style.yml
          git commit -m "Keep only semantic questionnaire instruction styling"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4
