name: Fix q2a explicit black

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-q2a-explicit-black.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-q2a-explicit-black
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply explicit black question title
        run: echo '' | base64 -d | python
      - name: Verify
        run: |
          grep -q 'checkbox-question-title' assets/questionnaire.js
          grep -q 'color:#111827 !important' index.html
          grep -q 'question-black-v39' index.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-q2a-explicit-black.yml
          git add assets/questionnaire.js index.html .github/workflows/fix-q2a-explicit-black.yml
          git commit -m 'Make checkbox question titles explicitly black'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
