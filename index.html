      .definition-list > p:nth-child(2),
      .definition-list > p:nth-child(3) {
        font-size: 0 !important;
      }

      .definition-list > p:nth-child(2) > *,
      .definition-list > p:nth-child(3) > * {
        display: none !important;
      }

      .definition-list > p:nth-child(2)::before,
      .definition-list > p:nth-child(3)::before,
      .definition-list > p:nth-child(2)::after,
      .definition-list > p:nth-child(3)::after {
        display: block;
        direction: rtl;
        text-align: right;
        font-size: 1rem;
        line-height: 1.9;
      }

      .definition-list > p:nth-child(2)::before,
      .definition-list > p:nth-child(3)::before {
        margin-bottom: 0.35rem;
        font-weight: 700;
      }

      .definition-list > p:nth-child(2)::before {
        content: 'وسائل التواصل الرسمية للوزارة';
      }

      .definition-list > p:nth-child(2)::after {
        content: 'يقصد بوسائل التواصل الرسمية للوزارة مجموع القنوات والوسائط التي تعتمدها الوزارة بصفة رسمية للتواصل العمومي بشأن برنامج الدعم المباشر للسكن، قصد نشر المعلومات المتعلقة بأهدافه وشروط الاستفادة منه ومساطره وإجراءاته ومستجداته، وتمكين المواطنين من الولوج إلى المعطيات والخدمات المرتبطة به. وتشمل، على سبيل المثال لا الحصر، الموقع الإلكتروني الرسمي للوزارة، ومنصة «دعم سكن» وتطبيقها، والصفحات والحسابات الرسمية على شبكات التواصل الاجتماعي، والبلاغات والمنشورات الرسمية، وغيرها من القنوات المعتمدة للتواصل بشأن البرنامج. ولا يُشترط في هذه الوسائل أن تتيح للمواطنين إمكانية التواصل مع الوزارة أو تلقي رد منها، إذ قد يقتصر دورها على نشر المعلومات وإتاحتها للعموم.';
      }

      .definition-list > p:nth-child(3)::before {
        content: 'وسائل التواصل الرسمية التي تتيح التفاعل';
      }

      .definition-list > p:nth-child(3)::after {
        content: 'يقصد بوسائل التواصل الرسمية التي تتيح التفاعل القنوات الرسمية التي تعتمدها الوزارة في إطار برنامج الدعم المباشر للسكن، والتي تمكّن المواطنين، إلى جانب الاطلاع على المعلومات، من التواصل مع الوزارة عبر توجيه الأسئلة، وطلب التوضيحات، وتقديم الملاحظات أو المقترحات أو الشكايات، مع إمكانية تلقي رد أو تتبع مآلها. وتشمل، على سبيل المثال لا الحصر، خدمات التواصل والمساعدة المتاحة عبر منصة «دعم سكن» وتطبيقها، والبريد الإلكتروني ورقم المساعدة المخصصين للبرنامج، والبوابة الوطنية للشكايات، والرسائل الموجهة إلى الوزارة عبر حساباتها الرسمية على شبكات التواصل الاجتماعي.';
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const oldTitle = 'القسم الرابع: الاستجابة المؤسسية المدركة';
        const newTitle = 'القسم الرابع: الاستجابة المؤسسية';

        function replaceSectionFourTitle() {
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.nodeValue && node.nodeValue.includes(oldTitle)) {
              node.nodeValue = node.nodeValue.replaceAll(oldTitle, newTitle);
            }
          }
        }

        replaceSectionFourTitle();
        window.addEventListener('load', replaceSectionFourTitle);
        const observer = new MutationObserver(replaceSectionFourTitle);
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          characterData: true,
        });
      })();
    </script>
  </body>
