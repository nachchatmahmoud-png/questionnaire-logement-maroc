    <script>
      window.addEventListener('error', function () {
        document.documentElement.dataset.scriptError = '1';
      });
      (() => {
        const nativeStringify = JSON.stringify.bind(JSON);
        JSON.stringify = (value, ...args) => {
          if (value && value.schema_version === '2026-08-07-final' && value.answers?.q2 !== 'نعم') {
            value = {
              ...value,
              scores: Object.fromEntries(Object.keys(value.scores || {}).map((key) => [key, null])),
            };
          }
          return nativeStringify(value, ...args);
        };
      })();
    </script>
    <script type="module" crossorigin src="/questionnaire-logement-maroc/assets/questionnaire.js?v=20260812-desktop-question-black-v41"></script>
    <style>
      #boot-fallback{max-width:760px;margin:48px auto;padding:28px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;font-family:Arial,sans-serif;line-height:1.8;text-align:center;color:#172033}
      #boot-fallback h1{font-size:1.45rem;margin:0 0 10px;font-weight:700}
      #boot-fallback p{margin:0;color:#667085;font-weight:400}
      .hero-lead-mobile{display:none}

      /* Auth design v2 — lisible, rassurant et adapté au mobile. */
      .auth-shell{min-height:100vh;padding-bottom:28px}
      .auth-card{
        position:relative;
        isolation:isolate;
        overflow:hidden;
        width:min(100% - 28px,660px);
        margin:32px auto;
        padding:38px 40px 34px;
        border:1px solid rgba(37,99,235,.14);
        border-radius:26px;
        background:linear-gradient(180deg,#fff 0%,#fbfdff 100%);
        box-shadow:0 24px 64px rgba(15,23,42,.11),0 3px 12px rgba(37,99,235,.06);
        text-align:center;
      }
      .auth-card::before{
        content:"";
        position:absolute;
        z-index:-1;
        inset:0 0 auto;
        height:6px;
        background:linear-gradient(90deg,#4285f4 0 25%,#34a853 25% 50%,#fbbc05 50% 75%,#ea4335 75% 100%);
      }
      .auth-card::after{
        content:"";
        position:absolute;
        z-index:-2;
        top:-115px;
        left:50%;
        width:330px;
        height:230px;
        border-radius:50%;
        background:radial-gradient(circle,rgba(66,133,244,.12),rgba(66,133,244,0) 70%);
        transform:translateX(-50%);
        pointer-events:none;
      }
      .auth-card h2{
        margin:16px 0 18px;
        color:#172033;
        font-size:1.68rem;
        font-weight:800;
        line-height:1.45;
        letter-spacing:-.01em;
      }
      .auth-card h2::after{
        content:"";
        display:block;
        width:46px;
        height:3px;
        margin:12px auto 0;
        border-radius:999px;
        background:#2563eb;
      }
      .auth-icon{
        position:relative;
        display:grid;
        place-items:center;
        width:66px;
        height:66px;
        margin:0 auto;
        border:1px solid #e3eaf5;
        border-radius:20px;
        background:#fff;
        color:#4285f4;
        box-shadow:0 10px 26px rgba(15,23,42,.10);
        font:700 2rem/1 Arial,sans-serif;
      }
      .auth-icon::before{
        content:"";
        position:absolute;
        inset:-2px;
        z-index:-1;
        border-radius:22px;
        background:conic-gradient(from 20deg,#4285f4,#34a853,#fbbc05,#ea4335,#4285f4);
      }
      .auth-help{
        position:relative;
        max-width:540px;
        margin:0 auto 22px;
        padding:17px 52px 17px 20px;
        border:1px solid #dce8f8;
        border-radius:16px;
        background:#f6f9ff;
        color:#40506a;
        font-size:1.02rem;
        line-height:1.95;
        text-align:right;
      }
      .auth-help::before{
        content:"✓";
        position:absolute;
        top:19px;
        right:17px;
        display:grid;
        place-items:center;
        width:24px;
        height:24px;
        border-radius:50%;
        background:#e8f5ec;
        color:#16823b;
        font:800 .9rem/1 Arial,sans-serif;
      }
      .auth-action-hint{
        margin:4px auto 2px;
        color:#253858;
        font-size:1.02rem;
        font-weight:800;
        line-height:1.7;
        text-align:center;
      }
      .auth-action-hint::after{
        content:"👇";
        display:block;
        margin:8px auto 0;
        font-size:1.45rem;
        line-height:1;
      }
      .google-signin-button{
        display:flex;
        align-items:center;
        justify-content:center;
        width:fit-content;
        max-width:100%;
        min-height:52px;
        margin:22px auto 0;
        padding:4px;
        border:4px solid transparent;
        border-radius:18px;

          linear-gradient(#fff,#fff) padding-box,
          linear-gradient(90deg,#4285f4 0 25%,#34a853 25% 50%,#fbbc05 50% 75%,#ea4335 75% 100%) border-box;

        transition:transform .2s ease,box-shadow .2s ease;
        cursor:pointer;
      }
      .google-signin-button:hover,

        transform:translateY(-2px);
        box-shadow:0 14px 32px rgba(15,23,42,.15),0 6px 16px rgba(66,133,244,.18);
      }
      .google-signin-button iframe{max-width:calc(100% / 1.24);transform:scale(1.24);transform-origin:center}
      .auth-loading{display:flex;align-items:center;justify-content:center;gap:11px;min-height:52px;margin-top:22px;color:#344054;font-weight:700}
      .auth-loading span{width:22px;height:22px;border:3px solid #d7dfec;border-top-color:#2563eb;border-radius:50%;animation:auth-spin .8s linear infinite}
      .auth-alert{max-width:540px;margin:18px auto 22px;padding:17px 18px;border:1px solid #f1b8be;border-radius:16px;background:#fff5f5;color:#8a1c1c;text-align:right}
      .auth-alert strong{display:block;margin-bottom:5px}
      .auth-alert p{max-width:none;margin:0;color:inherit;line-height:1.85}
      .auth-alert-blocked{border-color:#f0b2b2;background:#fff1f1}
      .auth-config-error{max-width:540px;margin:16px auto 0;padding:13px 16px;border:1px solid #f4d38d;border-radius:14px;background:#fff8e8;color:#825600;line-height:1.8}
      @keyframes auth-spin{to{transform:rotate(360deg)}}

      .interaction-channels-card{
        display:block !important;
        max-width:850px;
        margin-inline:auto;
        padding:clamp(18px,2.8vw,25px) clamp(18px,3.2vw,30px) !important;
        border-right:5px solid var(--gold) !important;
        background:linear-gradient(135deg,#fff9ea 0%,var(--gold-pale) 100%) !important;

      /* Échelle Likert : 1–5 restent uniquement dans le rappel au-dessus. */
      html body .legend-grid > span{
        font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif !important;

      /* Dans le tableau, on masque le numéro source et on affiche le libellé à côté de العبارة. */
      html body .likert-table thead th:not(:first-child){
        font-size:0 !important;
        color:transparent !important;
        white-space:normal !important;
        text-align:center !important;
        vertical-align:middle !important;
        min-width:90px !important;
        padding:.52rem .24rem !important;
        overflow:visible !important;
      }
      html body .likert-table thead th:not(:first-child)::after{
        display:block !important;
        font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif !important;
        font-size:14px !important;
        font-weight:700 !important;
        line-height:1.35 !important;
        color:#111827 !important;
        white-space:normal !important;
        text-align:center !important;
      }
      html body .likert-table thead th:nth-child(2)::after{content:"لا أوافق إطلاقًا" !important;}
      html body .likert-table thead th:nth-child(3)::after{content:"لا أوافق" !important;}
      html body .likert-table thead th:nth-child(4)::after{content:"لا أوافق ولا أعارض" !important;}
      html body .likert-table thead th:nth-child(5)::after{content:"أوافق" !important;}
      html body .likert-table thead th:nth-child(6)::after{content:"أوافق تمامًا" !important;}

      @media(max-width:760px){
        .hero-lead-desktop{display:none}

        .auth-shell .hero-lead{font-size:.92rem;line-height:1.75;margin-bottom:9px}
        .auth-shell .privacy-note{margin-top:9px;padding:10px 12px}
        .auth-shell footer{display:none}
        .interaction-channels-card{
          max-width:none;
          margin-inline:0;

          font-size:.94rem;
          line-height:1.95 !important;
          text-wrap:wrap;
        }
        .interaction-channels-card .interaction-lead{
          margin-bottom:.65rem !important;
          padding-bottom:.6rem !important;
          font-size:.97rem;
          line-height:1.85 !important;
        }
        .interaction-channels-card bdi{overflow-wrap:anywhere}
        .auth-card{width:calc(100% - 20px);margin:10px auto 14px;padding:24px 16px 20px;border-radius:19px}
        .auth-card h2{margin:10px 0 14px;font-size:1.34rem}
        .auth-icon{width:54px;height:54px;border-radius:16px;font-size:1.65rem}
        .auth-icon::before{border-radius:18px}
        .auth-help{margin-bottom:14px;padding:13px 43px 13px 12px;font-size:.94rem;line-height:1.75}
        .auth-help::before{top:17px;right:14px}

        .auth-action-hint{font-size:.94rem;line-height:1.6}
        .google-signin-button{direction:ltr;width:min(320px,calc(100vw - 56px));max-width:100%;min-height:50px;margin-top:15px;padding:3px;border-width:3px;border-radius:15px;overflow:hidden}

        html body .legend-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:7px !important;}
        html body .legend-grid > span{font-size:14px !important;}
        html body .likert-table thead th:not(:first-child){min-width:78px !important;padding:.44rem .18rem !important;}
        html body .likert-table thead th:not(:first-child)::after{font-size:13px !important;line-height:1.3 !important;}
      }
      @media(max-width:700px){
        html body .likert-wrap{overflow:visible !important}
        html body .likert-table{display:block !important;width:100% !important;min-width:0 !important;border-collapse:separate !important;background:transparent !important}
        html body .likert-table thead{display:none !important}
        html body .likert-table tbody{display:block !important}
        html body .likert-table tr{display:block !important;margin:0 0 12px;border:1px solid rgba(15,23,42,.12);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 5px 14px rgba(15,23,42,.06)}
        html body .likert-table td{border:0 !important}
        html body .likert-table td:first-child{display:block !important;width:100% !important;min-width:0 !important;padding:14px 12px !important;background:rgba(15,23,42,.045);font-size:1.04rem !important;font-weight:800 !important;line-height:1.75;color:#172033}
        html body .likert-table td:not(:first-child){display:block !important;width:100% !important;min-width:0 !important;padding:0 !important;border-top:1px solid rgba(15,23,42,.09) !important}
        html body .likert-table tbody td label{display:flex !important;flex-direction:row !important;width:100% !important;min-height:48px !important;align-items:center !important;justify-content:flex-start !important;gap:10px !important;padding:9px 12px !important;cursor:pointer}
        html body .likert-table tbody td label::after{content:attr(data-label);font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif;font-size:.90rem;font-weight:400;line-height:1.5;color:#475467}
        html body .likert-table tbody td label:has(input:checked){background:#eff6ff;color:#1d4ed8}
        html body .likert-table input{width:24px !important;height:24px !important;margin:0 !important;flex:0 0 auto}
        html body .legend-grid{display:none !important}
      }
      @media(max-width:480px){
        .interaction-channels-card{padding:14px 12px !important}
        .interaction-channels-card>p{font-size:.91rem;line-height:1.9 !important}
        .interaction-channels-card .interaction-lead{font-size:.94rem;line-height:1.8 !important}
        .auth-card{width:calc(100% - 16px);margin:8px auto 10px;padding:20px 12px 16px;border-radius:17px}
        .auth-card h2{font-size:1.18rem}
        .auth-help{padding:12px 40px 12px 10px;font-size:.9rem}
        .auth-help::before{right:12px}
        .google-signin-button{width:min(280px,calc(100vw - 56px));min-height:48px;margin-top:13px;padding:2px;border-width:3px;border-radius:14px}
        html body .legend-grid > span{font-size:13px !important;}
        html body .likert-table thead th:not(:first-child){min-width:70px !important;padding:.38rem .14rem !important;}
        html body .likert-table thead th:not(:first-child)::after{font-size:12px !important;line-height:1.25 !important;}
      }

      /* instruction-text-explicit-20260812-v1 */
      html body .instruction-text,
      html body .instruction-text *{
        color:#6b7280 !important;
        font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif !important;
        font-size:14px !important;
        font-weight:700 !important;
        font-style:normal !important;
        line-height:1.7 !important;
      }

      /* question-instruction-spacing-20260812-v3 */
      html body .question-card > legend:has(+ .instruction-text){margin-bottom:0 !important;}
      html body .question-card > legend + .instruction-text{display:block !important;margin:6px 0 12px !important;}
      html body .instruction-card > strong:not(.instruction-text) + .instruction-text{margin-top:6px !important;}

      /* checkbox-question-legend-black-20260812 */
      html body fieldset.question-card:has(input[type="checkbox"]) > legend:not(.instruction-text){
        color:#111827 !important;
      }

      /* checkbox-question-title-explicit-20260812 */
      html body .checkbox-question-title{
        color:#111827 !important;
        font-size:16px !important;
        font-weight:700 !important;
        font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif !important;
      }

      /* desktop-q2a-black-20260812-v1 */
      @media (min-width:761px){
        html body fieldset.question-card:has(input[type="checkbox"]) > legend.checkbox-question-title{
          color:#111827 !important;
        }
      }
</style>

  <body>
    <div id="root">
      <section id="boot-fallback" aria-live="polite">
        <h1>جاري تحميل الاستبيان…</h1>
        <p>إذا استمر ظهور هذه الرسالة، يرجى تحديث الصفحة مرة واحدة.</p>
      </section>
    </div>
    <script>
      setTimeout(() => {
        const root = document.getElementById('root');
        const fallback = document.getElementById('boot-fallback');
        if (fallback && root && root.contains(fallback)) {
          fallback.querySelector('h1').textContent = 'تعذر تشغيل الاستبيان على هذا المتصفح';
          fallback.querySelector('p').textContent = 'الصفحة نفسها متاحة، لكن أحد ملفات التشغيل لم يبدأ. يرجى إعادة تحميل الصفحة.';
        }
      }, 7000);
    </script>
