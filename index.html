<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>استبيان برنامج الدعم المباشر للسكن</title>
    <link rel="stylesheet" crossorigin href="/questionnaire-logement-maroc/assets/index-iQBeb6Ok.css?v=20260807-access-20" />
    <script>
      window.addEventListener('error', function () {
        document.documentElement.dataset.scriptError = '1';
      });
      (() => {
        const nativeStringify = JSON.stringify.bind(JSON);
        JSON.stringify = (value, ...args) => {
          if (value && value.schema_version === '2026-08-07-final' && value.answers?.q2 !== 'نعم') {
            value = {
              ...value,
              scores: Object.fromEntries(Object.keys(value.scores || {}).map((key) => [key, null])),
            };
          }
          return nativeStringify(value, ...args);
        };
      })();
    </script>
    <script src="/questionnaire-logement-maroc/assets/ui-cleanup-20260807.js?v=20260807-access-20"></script>
    <script src="/questionnaire-logement-maroc/assets/google-form-final-validation-20260807.js?v=20260807-access-20"></script>
    <script type="module" crossorigin src="/questionnaire-logement-maroc/assets/questionnaire-final-20260807.js?v=20260807-likert-source-1"></script>
    <style>
      #boot-fallback{max-width:760px;margin:48px auto;padding:28px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;font-family:Arial,sans-serif;line-height:1.8;text-align:center;color:#172033}
      #boot-fallback h1{font-size:1.45rem;margin:0 0 10px;font-weight:700}
      #boot-fallback p{margin:0;color:#667085;font-weight:400}

      /* Likert : numéros uniquement dans le rappel, libellés sans numéros dans le tableau. */
      html body .legend-grid > span{
        font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif !important;
        font-size:15px !important;
        font-weight:700 !important;
        line-height:1.45 !important;
        color:var(--ink) !important;
        text-align:center !important;
      }
      html body .likert-table thead th:not(:first-child){
        font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif !important;
        font-size:14px !important;
        font-weight:700 !important;
        line-height:1.35 !important;
        color:var(--ink) !important;
        white-space:normal !important;
        text-align:center !important;
        vertical-align:middle !important;
        min-width:86px !important;
        padding:.50rem .22rem !important;
      }
      @media(max-width:760px){
        html body .legend-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:7px !important;}
        html body .legend-grid > span{font-size:14px !important;}
        html body .likert-table thead th:not(:first-child){font-size:13px !important;min-width:76px !important;padding:.44rem .18rem !important;}
      }
      @media(max-width:480px){
        html body .legend-grid > span{font-size:13px !important;}
        html body .likert-table thead th:not(:first-child){font-size:12px !important;min-width:68px !important;padding:.38rem .14rem !important;}
      }
    </style>
    <script>
      (() => {
        const labels = ['لا أوافق إطلاقًا','لا أوافق','لا أوافق ولا أعارض','أوافق','أوافق تمامًا'];
        let queued = false;
        const apply = () => {
          document.querySelectorAll('.legend-grid').forEach((legend) => {
            const items = Array.from(legend.children).slice(0, 5);
            if (items.length !== 5) return;
            items.forEach((item, index) => {
              const wanted = `${index + 1} — ${labels[index]}`;
              if (item.textContent !== wanted) item.textContent = wanted;
            });
          });

          document.querySelectorAll('.likert-table thead tr').forEach((row) => {
            const headers = Array.from(row.querySelectorAll('th')).slice(1, 6);
            if (headers.length !== 5) return;
            headers.forEach((header, index) => {
              if (header.textContent !== labels[index]) header.textContent = labels[index];
              header.title = labels[index];
              header.setAttribute('aria-label', labels[index]);
            });
          });
        };
        const schedule = () => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            apply();
          });
        };
        new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', schedule);
        window.addEventListener('load', schedule);
        window.addEventListener('pageshow', schedule);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <section id="boot-fallback" aria-live="polite">
        <h1>جاري تحميل الاستبيان…</h1>
        <p>إذا استمر ظهور هذه الرسالة، يرجى تحديث الصفحة مرة واحدة.</p>
      </section>
    </div>
    <script>
      setTimeout(() => {
        const root = document.getElementById('root');
        const fallback = document.getElementById('boot-fallback');
        if (fallback && root && root.contains(fallback)) {
          fallback.querySelector('h1').textContent = 'تعذر تشغيل الاستبيان على هذا المتصفح';
          fallback.querySelector('p').textContent = 'الصفحة نفسها متاحة، لكن أحد ملفات التشغيل لم يبدأ. يرجى إعادة تحميل الصفحة.';
        }
      }, 7000);
    </script>
  </body>
</html>
