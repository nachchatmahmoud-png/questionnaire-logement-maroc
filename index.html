<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta http-equiv="Pragma" content="no-cache" />

    <meta name="description" content="استبيان أكاديمي حول التواصل العمومي المرتبط ببرنامج الدعم المباشر للسكن" />
    <title>استبيان برنامج الدعم المباشر للسكن</title>
    <link rel="stylesheet" crossorigin href="/questionnaire-logement-maroc/assets/index-iQBeb6Ok.css?v=20260807-access-4" />
    <script>
      window.addEventListener('error', function () {
        document.documentElement.dataset.scriptError = '1';
      });
      (() => {
        const nativeStringify = JSON.stringify.bind(JSON);
        JSON.stringify = (value, ...args) => {
          if (value && value.schema_version === '2026-08-07-final' && value.answers?.q2 !== 'نعم') {
            value = {
              ...value,
              scores: Object.fromEntries(Object.keys(value.scores || {}).map((key) => [key, null])),
            };
          }
          return nativeStringify(value, ...args);
        };
      })();
    </script>
    <script src="/questionnaire-logement-maroc/assets/ui-cleanup-20260807.js?v=20260807-access-4"></script>
    <script src="/questionnaire-logement-maroc/assets/google-form-final-validation-20260807.js?v=20260807-access-4"></script>
    <script src="/questionnaire-logement-maroc/assets/likert-scale-display-20260807.js?v=20260807-3"></script>
    <script type="module" crossorigin src="/questionnaire-logement-maroc/assets/questionnaire-final-20260807.js?v=20260807-access-4"></script>
    <style>
      #boot-fallback{max-width:760px;margin:48px auto;padding:28px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;font-family:Arial,sans-serif;line-height:1.8;text-align:center;color:#172033}
      #boot-fallback h1{font-size:1.45rem;margin:0 0 10px;font-weight:700}
      #boot-fallback p{margin:0;color:#667085;font-weight:400}

      /* Likert: never show the numeric scale to respondents. Values 1–5 remain internal only. */
      .likert-table thead th:nth-child(n+2){
        font-size:0 !important;
        color:transparent !important;
        white-space:normal !important;
        min-width:118px;
      }
      .likert-table thead th:nth-child(2)::after,
      .likert-table thead th:nth-child(3)::after,
      .likert-table thead th:nth-child(4)::after,
      .likert-table thead th:nth-child(5)::after,
      .likert-table thead th:nth-child(6)::after{
        display:block;
        font-size:.78rem;
        line-height:1.4;
        font-weight:500;
        color:#172033;
      }
      .likert-table thead th:nth-child(2)::after{content:'لا أوافق إطلاقًا';}
      .likert-table thead th:nth-child(3)::after{content:'لا أوافق';}
      .likert-table thead th:nth-child(4)::after{content:'لا أوافق ولا أعارض';}
      .likert-table thead th:nth-child(5)::after{content:'أوافق';}
      .likert-table thead th:nth-child(6)::after{content:'أوافق تمامًا';}

      @media(max-width:900px){
        .likert-table thead th:nth-child(n+2){min-width:105px;}
        .likert-table thead th:nth-child(n+2)::after{font-size:.73rem;}
      }
    </style>
  </head>
  <body>
    <div id="root">
      <section id="boot-fallback" aria-live="polite">
        <h1>جاري تحميل الاستبيان…</h1>
        <p>إذا استمر ظهور هذه الرسالة، يرجى تحديث الصفحة مرة واحدة.</p>
      </section>
    </div>
    <script>
      setTimeout(() => {
        const root = document.getElementById('root');
        const fallback = document.getElementById('boot-fallback');
        if (fallback && root && root.contains(fallback)) {
          fallback.querySelector('h1').textContent = 'تعذر تشغيل الاستبيان على هذا المتصفح';
          fallback.querySelector('p').textContent = 'الصفحة نفسها متاحة، لكن أحد ملفات التشغيل لم يبدأ. يرجى إعادة تحميل الصفحة.';
        }
      }, 7000);
    </script>
  </body>
</html>
