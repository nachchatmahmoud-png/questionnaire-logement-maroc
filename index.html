    <script>
      (() => {
        const nativeStringify = JSON.stringify.bind(JSON);
        JSON.stringify = (value, ...args) => {
          if (value && value.schema_version === '2026-08-07-final' && value.answers?.q2 !== 'نعم') {
            value = {
              ...value,
              scores: Object.fromEntries(Object.keys(value.scores || {}).map((key) => [key, null])),
            };
          }
          return nativeStringify(value, ...args);
        };
      })();
    </script>

    <script>
      setTimeout(() => {
        const root = document.getElementById('root');
        const fallback = document.getElementById('boot-fallback');
        if (fallback && root && root.contains(fallback)) {
          fallback.querySelector('h1').textContent = 'تعذر تشغيل الاستبيان على هذا المتصفح';
          fallback.querySelector('p').textContent = 'الصفحة نفسها متاحة، لكن أحد ملفات التشغيل لم يبدأ. يرجى إعادة تحميل الصفحة.';
        }
      }, 7000);
    </script>
