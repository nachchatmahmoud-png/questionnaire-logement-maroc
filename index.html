    <script>
      window.addEventListener('error', function () {
        document.documentElement.dataset.scriptError = '1';
      });
      (() => {
        const nativeStringify = JSON.stringify.bind(JSON);
        JSON.stringify = (value, ...args) => {
          if (value && value.schema_version === '2026-08-07-final' && value.answers?.q2 !== 'نعم') {
            value = {
              ...value,
              scores: Object.fromEntries(Object.keys(value.scores || {}).map((key) => [key, null])),
            };
          }
          return nativeStringify(value, ...args);
        };
      })();
    </script>

    <style>
      #boot-fallback{max-width:760px;margin:48px auto;padding:28px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;font-family:Arial,sans-serif;line-height:1.8;text-align:center;color:#172033}
      #boot-fallback h1{font-size:1.45rem;margin:0 0 10px;font-weight:700}
      #boot-fallback p{margin:0;color:#667085;font-weight:400}

      /* Affichage Likert imposé directement sur la page publique. */
      .legend-grid > span,
      .likert-table thead th:not(:first-child){
        font-size:0 !important;
        color:transparent !important;
        white-space:normal !important;
      }

      .legend-grid > span::before,
      .likert-table thead th:not(:first-child)::before{
        display:block;
        font-size:.72rem;
        font-weight:600;
        color:#667085;
        line-height:1.2;
        margin-bottom:.28rem;
      }

      .legend-grid > span::after,
      .likert-table thead th:not(:first-child)::after{
        display:block;
        font-size:1.08rem;
        font-weight:800;
        color:#172033;
        line-height:1.5;
      }

      .legend-grid > span:nth-child(1)::before,
      .likert-table thead th:nth-child(2)::before{content:'1';}
      .legend-grid > span:nth-child(2)::before,
      .likert-table thead th:nth-child(3)::before{content:'2';}
      .legend-grid > span:nth-child(3)::before,
      .likert-table thead th:nth-child(4)::before{content:'3';}
      .legend-grid > span:nth-child(4)::before,
      .likert-table thead th:nth-child(5)::before{content:'4';}
      .legend-grid > span:nth-child(5)::before,
      .likert-table thead th:nth-child(6)::before{content:'5';}

      .legend-grid > span:nth-child(1)::after,
      .likert-table thead th:nth-child(2)::after{content:'لا أوافق إطلاقًا';}
      .legend-grid > span:nth-child(2)::after,
      .likert-table thead th:nth-child(3)::after{content:'لا أوافق';}
      .legend-grid > span:nth-child(3)::after,
      .likert-table thead th:nth-child(4)::after{content:'لا أوافق ولا أعارض';}
      .legend-grid > span:nth-child(4)::after,
      .likert-table thead th:nth-child(5)::after{content:'أوافق';}
      .legend-grid > span:nth-child(5)::after,
      .likert-table thead th:nth-child(6)::after{content:'أوافق تمامًا';}

      .likert-table thead th:not(:first-child){
        min-width:150px !important;
        padding:.9rem .65rem !important;
        vertical-align:middle;
      }

      @media(max-width:900px){
        .legend-grid > span::after,
        .likert-table thead th:not(:first-child)::after{
          font-size:1rem;
          font-weight:800;
        }
        .likert-table thead th:not(:first-child){min-width:132px !important;}
      }
    </style>
  </head>
  <body>
    <div id="root">
      <section id="boot-fallback" aria-live="polite">
        <h1>جاري تحميل الاستبيان…</h1>
        <p>إذا استمر ظهور هذه الرسالة، يرجى تحديث الصفحة مرة واحدة.</p>
      </section>
    </div>
    <script>
      setTimeout(() => {
        const root = document.getElementById('root');
        const fallback = document.getElementById('boot-fallback');
        if (fallback && root && root.contains(fallback)) {
          fallback.querySelector('h1').textContent = 'تعذر تشغيل الاستبيان على هذا المتصفح';
          fallback.querySelector('p').textContent = 'الصفحة نفسها متاحة، لكن أحد ملفات التشغيل لم يبدأ. يرجى إعادة تحميل الصفحة.';
        }
      }, 7000);
    </script>
  </body>
</html>
